[project]
name            = 'ff8000'
dynamic         = ['version']
description     = 'A customizable, modular, fully-typed discord bot written in python (hikari). Designed for a mix of standard modules as well as easy integration with your own custom functionality, all in one sleek bot user on your server. Forked from one of my projects, ProtoBan.'
readme          = "README.md"
requires-python = "==3.14.6"

dependencies = [ #
	"arguably==1.3.0",
	"asyncstdlib==3.14.0",
	"hikari[speedups]==2.5.0",
	"hikari-arc==2.3.0",
	"hikari-miru==4.2.0",
	"nya-codeblock==0.1.2",
	"nya-scope==0.3.1",
	"rich==15.0.0",
	"nya-fmt==0.1.1",
	"platformdirs==4.11.0",
	"aiohttp==3.14.3",
	"aiolimiter>=1.2.1",
]

[project.scripts]
ff8000 = "ff8000.__main__:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path    = "src/ff8000/_version.py"
pattern = '__version__(?:: str)? *= *\"(?P<version>[^\"]+)\"'

[dependency-groups]
dev = [ #
	"ty==0.0.97",
	"ruff==0.17.3",
	"uv==0.13.7",
	"pip>=26.3",
]
